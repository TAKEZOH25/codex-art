<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }} | {{ site_name }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ description }}{% endblock %}">
    <link rel="canonical" href="{{ canonical_url }}">
    
    <!-- OpenGraph -->
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:type" content="{{ og_type|default('website') }}">
    {% if og_image %}
    <meta property="og:image" content="{{ og_image }}">
    {% endif %}
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ root_url }}/assets/styles.css">
    
    <!-- JSON-LD -->
    {% if json_ld %}
    <script type="application/ld+json">
        {{ json_ld | tojson | safe }}
    </script>
    {% endif %}
</head>
<body>
    {% include "components/organisms/site_header.html" %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% include "components/organisms/site_footer.html" %}

    <script src="{{ root_url }}/assets/search.js"></script>
</body>
</html>
