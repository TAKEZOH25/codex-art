<article class="card">
    <a href="{{ entity._urls[lang] if entity._urls else '#' }}">
        <figure>
            <img src="{{ entity.image_url }}" alt="{{ entity.text[lang].name }}" loading="lazy" width="400"
                height="300">
        </figure>
        <div class="body">
            <h3>{{ entity.text[lang].name }}</h3>
            <p>{{ entity.text[lang].short_description[:80] }}...</p>
            <span class="badge">{{ entity.type }}</span>
        </div>
    </a>
</article>
