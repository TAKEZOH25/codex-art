<header class="site-header">
    <div class="header-inner">
        <a href="{{ nav.home_url }}" class="logo">Art Virtuoso</a>
        <nav>
            <ul>
                <li><a href="{{ nav.codex_url }}" {% if request_path=='/codex/' %}class="active" {% endif %}>Codex</a>
                </li>
                <li><a href="/artistes/">{{ 'Artistes' if lang == 'fr' else 'Artists' }}</a></li>
                <li><a href="/mouvements/">{{ 'Mouvements' if lang == 'fr' else 'Movements' }}</a></li>
                <li><a href="/oeuvres/">{{ 'Œuvres' if lang == 'fr' else 'Artworks' }}</a></li>
            </ul>
        </nav>
        <div class="lang-switch">
            {% for other in other_langs %}
            <a href="{{ other.url }}">{{ other.code|upper }}</a>
            {% endfor %}
        </div>
    </div>
</header>
